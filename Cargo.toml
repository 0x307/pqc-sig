[package]
name        = "pqc-sig"
version     = "0.5.0"
edition     = "2021"
rust-version = "1.85"
authors     = ["Kenneth Harper"]
description = "Post-quantum digital signatures: ML-DSA (FIPS 204), SLH-DSA (FIPS 205), FN-DSA (FIPS 206) — standalone WASM-compatible"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/0x307/pqc-sig"
homepage = "https://0x307.com/crates"
documentation = "https://docs.rs/pqc-sig"
keywords    = ["post-quantum", "signatures", "ml-dsa", "slh-dsa", "wasm"]
categories  = ["cryptography", "wasm", "no-std"]

# This crate is a pure library (rlib-only) — it is NEVER the final linked artifact, and
# so never defines #[global_allocator]/#[panic_handler] itself (only the final binary
# knows whether std is available elsewhere in the link; a library can't validly infer
# that from its own feature flags). The standalone WASM cdylib artifact that DOES need
# those lang items lives in the sibling pqc-sig-wasm/ crate — see its own Cargo.toml.
[lib]
name       = "pqc_sig"
crate-type = ["rlib"]

# ── Core PQC — Pure Rust, no_std capable, WASM-compatible ────────────────────

[dependencies]
# FIPS 204 — ML-DSA (pure Rust, no_std compatible, WASM-native). Behind the `ml-dsa`
# feature, on by default.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core"], optional = true }

# FIPS 205 — SLH-DSA (pure Rust, no_std compatible, WASM-native). Behind the `slh-dsa`
# feature, on by default.
# Note: slh-dsa 0.2.0-rc.5 requires alloc features on its pkcs8/der/spki deps
slh-dsa = { version = "0.2.0-rc.5", default-features = false, features = ["alloc"], optional = true }

# slh-dsa's pkcs8/der/spki deps need alloc enabled explicitly. Only needed with slh-dsa.
pkcs8 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
der  = { version = "0.8", default-features = false, features = ["alloc"], optional = true }
spki = { version = "0.8", default-features = false, features = ["alloc"], optional = true }

# FIPS 206 — FN-DSA / Falcon (pure Rust, no_std + alloc, WASM-compatible, feature-gated)
fn-dsa = { version = "0.4", optional = true }

# Hybrid Ed25519 + ML-DSA-65 combiner (pure Rust, no_std + alloc, WASM-compatible, feature-gated —
# this crate is otherwise PQC-only)
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize", "rand_core"], optional = true }

# RNG abstraction — caller provides RNG, no OsRng hardcoding in library code
rand_core = { version = "0.6", default-features = false }

# Serialization — no_std with alloc
serde      = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Encoding — no_std compatible
base64ct = { version = "1", default-features = false, features = ["alloc"] }

# Multibase encoding for DID Documents (bs58)
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

# Zeroize secret key material on drop
zeroize = { version = "1", default-features = false, features = ["derive", "alloc"] }

# Constant-time comparison
subtle = { version = "2", default-features = false }

# Error handling — no_std compatible
thiserror = { version = "2", default-features = false }

[features]
# The signature algorithms are on by default. `default-features = false` gives the
# encoding surface alone: the key and signature types, algorithm identifiers, Multikey,
# base64url and JSON, with no signature implementation compiled in. CI asserts that
# build's dependency graph contains none (the `encoding-only` job).
default = ["std", "ml-dsa", "slh-dsa"]

# ml-dsa: ML-DSA-44/65/87 (FIPS 204) keypairs, signing and verification.
ml-dsa = ["dep:ml-dsa"]

# slh-dsa: the twelve SLH-DSA parameter sets (FIPS 205).
slh-dsa = ["dep:slh-dsa", "dep:pkcs8", "dep:der", "dep:spki"]

# std: enables std-dependent trait impls
std = [
    "serde/std",
    "serde_json/std",
    "zeroize/std",
]

# fndsa: FN-DSA / Falcon via fn-dsa (pure Rust, WASM-compatible)
fndsa = ["dep:fn-dsa"]

# hybrid: Ed25519 + ML-DSA-65 combiner via ed25519-dalek (pure Rust, WASM-compatible).
# Implies ml-dsa, which it is built on.
hybrid = ["ml-dsa", "dep:ed25519-dalek"]

[package.metadata.docs.rs]
all-features = true

# ── Examples ──────────────────────────────────────────────────────────────────
# `hybrid_bridge` uses the `hybrid`-gated pqc_sig::hybrid module and ed25519-dalek
# directly; `required-features` keeps `cargo build --examples` (default features, no
# `hybrid`) green while `cargo build --examples --all-features` still compiles it.
[[example]]
name = "hybrid_bridge"
required-features = ["hybrid"]

# The other examples and the backend test suites need the algorithms they exercise, so
# `cargo test --no-default-features` builds only what the encoding-only surface can run.
[[example]]
name = "domain_separation"
required-features = ["ml-dsa"]

[[example]]
name = "gen_kat_vectors"
required-features = ["ml-dsa", "slh-dsa"]

[[example]]
name = "prehash_large_payload"
required-features = ["ml-dsa"]

[[test]]
name = "ml_dsa_tests"
required-features = ["ml-dsa"]

[[test]]
name = "slh_dsa_tests"
required-features = ["slh-dsa"]

[[test]]
name = "kat_tests"
required-features = ["ml-dsa", "slh-dsa"]

[[test]]
name = "fn_dsa_tests"
required-features = ["fndsa"]

[dev-dependencies]
rand    = { version = "0.8", features = ["std"] }
hex     = "0.4"

# Used only by examples/tests to compute pre-hash digests (S-4). The library itself
# never hashes on the caller's behalf — see src/prehash.rs.
sha2    = "0.10"

# Used only by examples/gen_kat_vectors.rs and tests/kat_tests.rs (S-5) to compute
# SHA3/SHAKE pre-hash digests for the published KAT vectors — same "caller hashes"
# rule as sha2 above.
sha3    = "0.10"

# Independent multibase/multicodec implementations for interop testing (test-only, not
# runtime deps): validates our to_multibase() output against decoders we did not write.
ssi-multicodec = "0.2"
multibase      = "0.9"

# Benchmarks. In `benches/`, run by `cargo bench`, with a baseline and a
# statistical model — as opposed to a file in `examples/` called `bench_*`,
# which is a demo that runs when somebody remembers and is compared against
# nothing. `default-features = false` drops criterion's plotting stack, which
# pulls a large tree for HTML reports nobody reads in CI.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# ── Benchmarks ────────────────────────────────────────────────────────────────
[[bench]]
name = "signatures"
harness = false
required-features = ["ml-dsa", "slh-dsa"]

# Benchmarks measure speed, so they must not inherit the release profile's
# `opt-level = "z"`. That setting is correct for what this crate ships — a
# size-constrained WASM target — and wrong for a performance figure, which
# would otherwise describe a build nobody benchmarks for.
#
# Found by benchmarking: the first run measured the size-optimised build and
# produced figures that were slow across the board with no label saying why.
[profile.bench]
opt-level     = 3
lto           = true
codegen-units = 1
debug         = true

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"

[profile.release.package."*"]
opt-level = "z"
