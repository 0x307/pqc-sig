# cargo-vet audits for pqc-sig's own released versions (FAM-04).
#
# Written by hand in cargo-vet's audits.toml format (cargo vet was not
# installed where this was prepared). It holds audits only; this repo does
# not run `cargo vet` on its own dependencies yet, so there is no
# config.toml or imports.lock beside it.
#
# To trust these audits from your own project, add to your
# supply-chain/config.toml:
#
#   [imports.0x307-pqc-sig]
#   url = "https://raw.githubusercontent.com/0x307/pqc-sig/main/supply-chain/audits.toml"
#
# What an entry means: the maintainer has reviewed that published version in
# full (it is the maintainer's own code) against cargo-vet's built-in
# criteria. It is not an independent third-party audit; see README.md
# ("Audit status"). It covers pqc-sig's own code, not its dependencies. A new
# entry is added when each version is published. The yanked versions (0.1.0,
# 0.2.0, 0.2.1, 0.3.0, 0.3.1, 0.4.0, 0.4.1; see CHANGELOG.md "Yanked
# versions") have no entry.

[[audits.pqc-sig]]
who = "Ed Johnson <165963846+eljay179@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.4.2"
notes = "Maintainer's own release. Pure Rust, #![forbid(unsafe_code)], no build script, no network or filesystem access. Signature code is delegated to RustCrypto ml-dsa and slh-dsa (a release candidate), fn-dsa (fndsa feature) and ed25519-dalek (hybrid feature)."

[[audits.pqc-sig]]
who = "Ed Johnson <165963846+eljay179@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.4.2 -> 0.4.3"
notes = "Maintainer's own release. No change to src/. Adds a ctutils >= 0.4.4 version floor (RUSTSEC-2026-0385) and raises the MSRV to 1.87."

[[audits.pqc-sig]]
who = "Ed Johnson <165963846+eljay179@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.4.2 -> 0.5.0"
notes = "Maintainer's own release. ML-DSA and SLH-DSA move behind the ml-dsa and slh-dsa features (cfg attributes in lib.rs and prehash.rs); no change to cryptographic code or wire encodings."

[[audits.pqc-sig]]
who = "Ed Johnson <165963846+eljay179@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.5.0 -> 0.5.1"
notes = "Maintainer's own release. No change to src/. Adds the ctutils >= 0.4.4 floor (RUSTSEC-2026-0385), raises the MSRV to 1.87, docs and CI changes."
